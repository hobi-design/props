name: Theme report
description: Tell us how a section behaves in your theme, whether it works or not.
title: "[Theme] "
labels: ["theme"]
body:
  - type: input
    id: theme
    attributes:
      label: Theme and version
      description: Shown in your Shopify admin under Online Store → Themes.
      placeholder: Impulse 7.4
    validations:
      required: true
  - type: input
    id: section
    attributes:
      label: Section
      placeholder: Timeline
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: Result
      options:
        - Works as expected
        - Works with a visual issue
        - Doesn't work
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: What you saw
      description: A screenshot helps most. Mention desktop or mobile if it only happens on one.
  - type: input
    id: url
    attributes:
      label: Page URL
      description: Optional. Leave it out if the store isn't public.
